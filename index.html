<!DOCTYPE html>
<html>
<head>
  <title>CivicConnect - Feedback</title>
</head>
<body>
  <h2>Send Feedback to Your Representative</h2>

  <form action="/submit" method="POST">
    <input name="name" placeholder="Your Name" required><br>
    <input name="neighborhood" placeholder="Neighborhood" required><br>
    <textarea name="message" placeholder="Your message" required></textarea><br>

    <!-- Hidden input to capture location -->
    <input type="hidden" name="location" id="location">

    <button type="submit">Submit Feedback</button>
  </form>

  <script>
    // Get user's current geolocation and fill the hidden input
    navigator.geolocation.getCurrentPosition(function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      document.getElementById('location').value = `${lat},${lon}`;
    });
  </script>
